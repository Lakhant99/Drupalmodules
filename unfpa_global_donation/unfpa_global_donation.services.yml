services:
  unfpa_global_donation.main:
    class: '\Drupal\unfpa_global_donation\DonationPageService'
    arguments: ['@entity_type.manager', '@language_manager', '@database', '@request_stack']
  unfpa_global_donation.stripe:
    class: '\Drupal\unfpa_global_donation\StripeService'
    arguments: ['@entity_type.manager', '@language_manager', '@database', '@request_stack']

  unfpa_donate_redirect:
    class: Drupal\unfpa_global_donation\EventSubscriber\DonateRedirectSubscriber
    arguments: ['@path.current', '@path.alias_manager', '@path.matcher', '@current_route_match']
    tags:
      - {name: event_subscriber}
