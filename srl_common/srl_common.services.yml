services:
  srl_common.srl_common_domain_permission:
    class: Drupal\srl_common\Access\DomainAccessPermissionCheck
    tags:
      - {name: access_check, applies_to: _access_permission_domain_landing}
  srl_common.domain_microsite_permission:
    class: Drupal\srl_common\Access\DomainMicrositeAccessPermission
    tags:
      - {name: access_check, applies_to: _access_permission_domain_microsite}
  srl_common.domain_microsite_landing_permission:
    class: Drupal\srl_common\Access\DomainMicrositeLandingAccessPermission
    tags:
      - {name: access_check, applies_to: _access_permission_domain_microsite_landing}
  srl_common.landing_route_access_permission:
    class: Drupal\srl_common\Access\LandingRouteAccessPermission
    tags:
      - {name: access_check, applies_to: _landing_route_access_permission}      
  srl_common.srl_common_token:
    class: Drupal\srl_common\Access\srlCustomAccessCheck
    tags:
      - {name: access_check, applies_to: _access_check_token}
    # arguments: ['@csrf_token']
  srl_common.domain_access_permission:
    class: Drupal\srl_common\Access\PageAccessPermission
    tags:
      - {name: access_check, applies_to: _domain_access_permission}
  srl_common.landing_application_form_route_access_permission:
    class: Drupal\srl_common\Access\LandingApplicationFormRouteAccessPermission
    tags:
      - {name: access_check, applies_to: _landing_application_form_route_access_permission}
  srl_common.common_data:
    class: Drupal\srl_common\CommonData
    arguments: ['@database']
