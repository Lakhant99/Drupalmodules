university_info.settings:
  path: '/admin/config/domain/domain-info'
  defaults:
    _form: '\Drupal\university_info\Form\UniversityInfoForm'
    _title: 'University info configuration'
  requirements:
    _permission: 'administer domains'
university_DMSAPI.settings:
  path: '/admin/config/dms-api'
  defaults:
    _form: '\Drupal\university_info\Form\UniversityDMS_API_Config'
    _title: 'University DMS configuration'
  requirements:
    _permission: 'administer domains'
university_API_Paymentlink.settings:
  path: '/admin/config/domain/domain-info/api-payment-link'
  defaults:
    _form: '\Drupal\university_info\Form\UniversityAPI_Paymentlink'
    _title: 'University API Payment Link configuration'
  requirements:
    _permission: 'administer domains'